[package]
name = "host-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
session-task = { path = "../session-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", features = ["thread-pool"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
