[package]
name = "session-core"
version = "0.0.0"
edition = "2021"
publish = false

# PROTOTYPE. serde/serde_json cannot do I/O by themselves; sans-io-core has no dependencies.
# The library names no runtime. Futures are std::future only.
[dependencies]
sans-io-core = { path = "../sans-io-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
