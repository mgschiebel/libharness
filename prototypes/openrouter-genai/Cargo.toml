[package]
name = "openrouter-genai"
version = "0.0.0"
edition = "2021"
publish = false
description = "PROTOTYPE (throwaway): OpenRouter model-call adapter built on the genai crate (ticket #31)"

[workspace]

[dependencies]
genai = "=0.7.2"
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
# Only for the optional "adapter owns a runtime" mode; genai already pulls tokio in.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
futures-executor = { version = "0.3", features = ["thread-pool"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
