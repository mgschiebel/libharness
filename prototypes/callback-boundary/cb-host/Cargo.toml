[package]
name = "cb-host"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
gated = false

# The host side of the prototype: scenarios, mocks, the wasmtime embedding (B3). wasmtime
# lives here and only here (never in a gated crate).
[dependencies]
cb-core = { path = "../cb-core" }
thread-runner = { path = "../thread-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", features = ["thread-pool"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
