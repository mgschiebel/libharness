[workspace]
resolver = "3"
members = ["crates/libharness", "crates/libharness-probe"]
# Only gated, plain `cargo build` friendly crates. The probe is a cdylib for wasm32v1-none and is built
# explicitly. The gate itself always runs per package (`cargo check -p <crate> --target wasm32v1-none`),
# never workspace-wide: feature unification across members can switch `std` on in the gated tree (ADR 0002).
default-members = ["crates/libharness"]

[workspace.package]
edition = "2024"
version = "0.0.0"
# Nothing is published in the MVP slice, and the final licence decision is out of scope (spec #38).
publish = false

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
