[package]
name = "host"
version = "0.0.0"
edition = "2021"
publish = false
# PROTOTYPE (throwaway, #27): ordinary std host embedding the no_std core. Unconstrained deps.
[features]
std-mutex = ["nostd-core/std-mutex"]
[dependencies]
nostd-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std", "preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = { version = "0.3", features = ["thread-pool"] }
tracing = "0.1"
tracing-subscriber = "0.3"
schemars = "1"
