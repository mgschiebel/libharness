[package]
name = "conformance"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
provider-adapter = { path = "../provider-adapter" }
mock-server = { path = "../mock-server" }
transport-std = { path = "../transport-std" }
transport-ureq = { path = "../transport-ureq", default-features = false }
transport-reqwest = { path = "../transport-reqwest", default-features = false, features = ["owned-runtime"] }
futures = { version = "0.3", features = ["thread-pool"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
